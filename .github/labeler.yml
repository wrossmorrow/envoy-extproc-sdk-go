sdk:
  - changed-files:
      - any-glob-to-any-file:
          - '!(*_test).go'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - '*_test.go'
          - 'test/**'
          - 'loadtest/**'

conformance:
  - changed-files:
      - any-glob-to-any-file:
          - 'conformance/**'
          - 'CONFORMANCE.md'
          - 'docs/CONFORMANCE_PLAN.md'

examples:
  - changed-files:
      - any-glob-to-any-file:
          - 'examples/**'

ci:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**'
          - 'justfile'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - 'docs/**'

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - '**/go.mod'
          - '**/go.sum'
