name: Pull Request Labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply labels based on changed paths
        uses: actions/labeler@v7
        with:
          sync-labels: true
