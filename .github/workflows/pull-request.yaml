name: Pull Request Checks
on: 
  - push
  - pull_request
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check build
        run: go build -o bin/extproc ./src
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Start compose setup
        run: docker compose -f test/compose.yaml up --build -d
      - name: Run tests
        working-directory: test
        run: go test -v ./...
      - name: Stop compose setup
        if: always()
        run: docker compose -f test/compose.yaml down --volumes
