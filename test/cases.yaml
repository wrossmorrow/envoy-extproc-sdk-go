cases:
  - name: noop
    description: no op run that just shouldn't fail
    request:
      headers: {}
      body: {}
  - name: clear request body
    request:
      headers: {}
      body:
        clear_request_body: true
  - name: clear response body
    request:
      headers: {}
      body:
        clear_response_body: true
  - name: add a request header
    request:
      headers:
        x-add-me: "true"
      body: {}
  - name: remove a request header
    request:
      headers:
        x-remove-me: "true"
      body:
        remove_request_headers:
          - x-remove-me
  - name: overwrite a request header
    request:
      headers:
        x-overwrite-me: "old value"
      body:
        overwrite_request_headers:
          x-overwrite-me: "new value"
  - name: add a response header
    request:
      headers: {}
      body:
        add_response_headers:
          x-add-me: "true"
  - name: remove a response header
    request:
      headers: {}
      body:
        remove_response_headers:
          - date
  - name: overwrite a response header
    request:
      headers: {}
      body:
        overwrite_response_headers:
          content-type: "test/plain"
  # TODO: requires work
  - name: cancel a request
    request:
      headers: {}
      body:
        cancel_request: true
        cancel_request_status: 400
        cancel_request_headers:
          x-custom-header: "true"
        cancel_request_body: "{\"error\":\"BadRequest\",\"detail\":\"Testing bad requests\"}"
